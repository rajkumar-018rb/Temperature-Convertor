<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="converter-card">

            <div class="icon">
                🌡️
            </div>

            <h1>Temperature Converter</h1>

            <p class="subtitle">
                Convert temperature easily between Celsius,
                Fahrenheit and Kelvin.
            </p>


            <!-- Temperature Input -->

            <div class="input-group">

                <label for="temperature">
                    Enter Temperature
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter temperature"
                    step="any"
                >

            </div>


            <!-- Unit Selector -->

            <div class="input-group">

                <label for="unit">
                    Select Input Unit
                </label>

                <select id="unit">

                    <option value="celsius">
                        Celsius (°C)
                    </option>

                    <option value="fahrenheit">
                        Fahrenheit (°F)
                    </option>

                    <option value="kelvin">
                        Kelvin (K)
                    </option>

                </select>

            </div>


            <!-- Error Message -->

            <p id="error-message" class="error-message"></p>


            <!-- Buttons -->

            <div class="button-group">

                <button
                    type="button"
                    id="convert-btn"
                    class="convert-btn">
                    Convert
                </button>

                <button
                    type="button"
                    id="reset-btn"
                    class="reset-btn">
                    Reset
                </button>

            </div>


            <!-- Results -->

            <div class="results" id="results">

                <div class="result-box">

                    <span class="result-icon">
                        🌡️
                    </span>

                    <div>
                        <h3>Celsius</h3>

                        <p id="celsius-result">
                            -- °C
                        </p>
                    </div>

                </div>


                <div class="result-box">

                    <span class="result-icon">
                        🔥
                    </span>

                    <div>
                        <h3>Fahrenheit</h3>

                        <p id="fahrenheit-result">
                            -- °F
                        </p>
                    </div>

                </div>


                <div class="result-box">

                    <span class="result-icon">
                        ❄️
                    </span>

                    <div>
                        <h3>Kelvin</h3>

                        <p id="kelvin-result">
                            -- K
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
